<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exhibition Competitions Portal</title>
    <link rel="icon" type="image/png" href="logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 1. LOADING SCREEN STYLING */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #010610;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Chakra Petch', sans-serif;
            animation: hideLoader 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.8s; 
        }

        @keyframes hideLoader {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none; }
        }

        .loader-logo {
            width: 100px;
            height: 100px;
            background-color: #000;
            border-radius: 50%;
            margin-bottom: 25px;
            border: 2px solid #38b6ff;
            box-shadow: 0 0 15px rgba(56, 182, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .loader-text {
            color: #ffffff;
            font-size: 19px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(56, 182, 255, 0.6);
            animation: textBlink 0.3s infinite alternate;
        }
        
        @keyframes textBlink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .progress-container {
            width: 200px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(56, 182, 255, 0.2);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #38b6ff;
            box-shadow: 0 0 10px #38b6ff;
            animation: fillBar 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* 2. MAIN PAGE BACKGROUND STYLING */
        body {
            background: linear-gradient(-45deg, #010610, #020c10, #00365a, #010610, #020c1b);
            background-size: 400% 400%;
            animation: liquidBg 30s ease infinite; 
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 40px 0;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        @keyframes liquidBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* NEON ICT LINES STYLING */
        .lines-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .neon-line {
            position: absolute;
            opacity: 0.7;
        }

        .neon-line.horizontal {
            height: 2px;
            width: 60%;
            left: -60%;
            background: linear-gradient(90deg, transparent, #38b6ff, transparent);
            box-shadow: 0 0 12px #38b6ff, 0 0 20px #38b6ff;
            animation: moveHorizontal infinite linear;
        }

        .neon-line.vertical {
            width: 2px;
            height: 60%;
            top: -60%;
            background: linear-gradient(180deg, transparent, #38b6ff, transparent);
            box-shadow: 0 0 12px #38b6ff, 0 0 20px #38b6ff;
            animation: moveVertical infinite linear;
        }

        @keyframes moveHorizontal {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateX(280vw); opacity: 0; }
        }

        @keyframes moveVertical {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(280vh); opacity: 0; }
        }

        .neon-line:nth-child(1) { top: 12%; animation-duration: 9s; animation-delay: 0s; }
        .neon-line:nth-child(2) { top: 35%; animation-duration: 14s; animation-delay: 3s; }
        .neon-line:nth-child(3) { top: 68%; animation-duration: 11s; animation-delay: 1s; }
        .neon-line:nth-child(4) { top: 88%; animation-duration: 16s; animation-delay: 5s; }

        .neon-line:nth-child(5) { left: 15%; animation-duration: 12s; animation-delay: 2s; }
        .neon-line:nth-child(6) { left: 50%; animation-duration: 10s; animation-delay: 0s; }
        .neon-line:nth-child(7) { left: 82%; animation-duration: 15s; animation-delay: 4s; }

        .wrapper {
            text-align: center;
            width: 82%; 
            max-width: 720px; 
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        /* LIQUID GLASS CENTER PANEL */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(2, 10, 20, 0.65)); 
            backdrop-filter: blur(25px) saturate(180%);         
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.4),
                inset 0 -2px 10px rgba(56, 182, 255, 0.15),
                0 0 30px rgba(56, 182, 255, 0.12);
        }

        .logo-container {
            width: 120px;
            height: 120px;
            background-color: #000000;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(56, 182, 255, 0.4);
            box-shadow: 0 0 15px rgba(56, 182, 255, 0.2);
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* TYPING TITLE & CURSOR STYLING */
        h1 {
            font-size: 23px !important; 
            font-family: 'Chakra Petch', sans-serif; 
            color: #ffffff; 
            margin-bottom: 12px !important; 
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            text-transform: none;
            display: inline-block;
            min-height: 28px;
        }

        .cursor {
            color: #38b6ff;
            font-weight: bold;
            display: inline-block;
            margin-left: 3px;
            animation: blink 0.6s infinite alternate;
            text-shadow: 0 0 8px #38b6ff;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* POP-UP ANIMATION FOR BUTTONS CONTAINER */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px; 
            opacity: 0;
            transform: scale(0.85) translateY(25px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .link-list.popup-show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .link-item {
            display: block;
            text-decoration: none;
            color: #000000; 
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* BUTTONS 1-4 DEFAULT COLOR */
        .btn-1, .btn-2, .btn-3, .btn-4 { 
            background-color: #38b6ff; 
        }

        /* BOTTOM SPECIAL BUTTON COLOR (NEON EMERALD) */
        .btn-5 { 
            background-color: #00e676; 
            color: #000000;
        }

        /* LIQUID GLASS HOVER EFFECT ON BUTTONS 1-4 */
        .link-item:not(.btn-5):hover { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(56, 182, 255, 0.18)) !important; 
            backdrop-filter: blur(14px) saturate(200%) !important;                  
            -webkit-backdrop-filter: blur(14px) saturate(200%) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;   
            border-top: 1px solid rgba(255, 255, 255, 0.9) !important;
            color: #ffffff !important;                                
            font-size: 19px !important; 
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.5),
                inset 0 1px 2px rgba(255, 255, 255, 0.7),
                0 0 30px rgba(56, 182, 255, 0.4) !important; 
            transform: translateY(-2px);
        }

        /* LIQUID GLASS HOVER EFFECT ON BOTTOM BUTTON */
        .btn-5:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(0, 230, 118, 0.25)) !important;
            backdrop-filter: blur(14px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(14px) saturate(200%) !important;
            border: 1px solid rgba(0, 230, 118, 0.8) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.9) !important;
            color: #ffffff !important;
            font-size: 19px !important;
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.5),
                inset 0 1px 2px rgba(255, 255, 255, 0.7),
                0 0 30px rgba(0, 230, 118, 0.5) !important;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            body { padding: 20px 0; }
            .wrapper { width: 92%; }
            .glass-panel { padding: 30px 18px; }
            .link-item { font-size: 14px; padding: 13px 12px; }
            .link-item:hover { font-size: 15.5px !important; }
            .logo-container { width: 100px; height: 100px; }
            h1 { font-size: 16px; } 
        }
    </style>
</head>
<body>

<div id="loader-screen">
    <div class="loader-logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentNode.innerHTML='<span style=\'color:#38b6ff;font-weight:bold;font-size:14px;\'>LOGO</span>'">
    </div>
    <div class="loader-text">LOADING...</div>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</div>

<div class="lines-container">
    <div class="neon-line horizontal"></div>
    <div class="neon-line horizontal"></div>
    <div class="neon-line horizontal"></div>
    <div class="neon-line horizontal"></div>
    <div class="neon-line vertical"></div>
    <div class="neon-line vertical"></div>
    <div class="neon-line vertical"></div>
</div>

<div class="wrapper">
    <div class="glass-panel">
        <div class="logo-container">
            <img src="logo.png" alt="Exhibition Logo" onerror="this.style.display='none'; this.parentNode.innerHTML='<span style=\'color:#38b6ff;font-weight:bold;font-size:16px;\'>LOGO</span>'">
        </div>

        <!-- TYPING TITLE WITH CURSOR -->
        <h1 id="typewriter-title"></h1><span class="cursor">|</span>
        <br>
        
        <!-- POPUP BUTTONS CONTAINER -->
        <div class="link-list" id="link-list">
            <a href="https://forms.gle/Usi4tnVCRTthzk3B9" target="_blank" class="link-item btn-1">MindRush - Quiz Compitition</a>
            <a href="https://forms.gle/6z9gVKVFyGA8RZYKA" target="_blank" class="link-item btn-2">FutureBit - Smart Solutions with Micro:bit</a>
            <a href="https://forms.gle/F7HZMD6GhZPLzmvj8" target="_blank" class="link-item btn-3">The Great Debate</a>
            <a href="https://forms.gle/4kUoTAVqRNbthAfy9" target="_blank" class="link-item btn-4">Path Finders - RoboTrack Championship</a>
            <a href="https://drive.google.com/drive/folders/1FKJq7yQoPtnNwX8bqlKc-3B12a2wtiaj?usp=sharing" target="_blank" class="link-item btn-5">Competition Rules</a>
        </div>
    </div>
</div>

<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const text = "Select Your Competition Below to Register";
            const titleEl = document.getElementById("typewriter-title");
            const linkListEl = document.getElementById("link-list");
            let index = 0;

            function typeLetter() {
                if (index < text.length) {
                    titleEl.textContent += text.charAt(index);
                    index++;
                    setTimeout(typeLetter, 25);
                } else {
                    setTimeout(() => {
                        linkListEl.classList.add("popup-show");
                    }, 150);
                }
            }

            typeLetter();
        }, 1200); 
    });
</script>

</body>
</html>
